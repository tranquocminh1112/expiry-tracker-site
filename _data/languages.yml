# Languages available on the support/privacy site.
# `home` / `privacy` are the page permalinks for each language.
# `app_name` (the App Store name in that language) and `description` fill <title> and the meta tags.
# `slug` names the per-language files (assets/og/<slug>.png, assets/screens/<slug>/).
# `badge` is the Apple badge locale; `badge_width` is its width at 48 px height (Apple's SVG is 40 px high).
# Keep in sync with page front matter (`lang`, `page_id`) and site/_layouts/default.html.
- code: vi
  slug: vi
  badge: vi-vn
  badge_width: 144
  name: Tiếng Việt
  home: /
  privacy: /privacy
  app_name: "Nhắc hạn"
  description: "Nhắc hạn: ứng dụng iPhone miễn phí ghi hạn của đồ ăn, thuốc, voucher, điểm thành viên, SIM trong nhà, nhắc trước khi hết hạn và dùng chung với cả nhà qua iCloud."
